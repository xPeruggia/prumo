# Coleta diária nas fontes oficiais e publicação no GitHub Pages.
# Horários em UTC: 09h, 13h e 22h equivalem a 6h, 10h e 19h em Brasília
# (antes do expediente, depois das divulgações das 9h do IBGE e do BCB, e depois do Copom).

name: Atualizar dados

on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 13 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
  # Mudanças no código (não nos dados) também coletam e publicam, inclusive no primeiro envio.
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - '**.md'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Sempre a versão mais recente do ramo, que pode já ter dados de uma coleta anterior na fila.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testar regras de comparação e verificação
        run: npm run testar

      - name: Coletar nas fontes oficiais
        run: node scripts/atualizar.mjs

      - name: Registrar a coleta no histórico
        run: |
          git config user.name "prumo-coleta"
          git config user.email "prumo-coleta@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nenhum dado mudou desde a última coleta."
            exit 0
          fi
          git commit -m "Coleta de $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M') (horário de Brasília)"
          # Em conflito nos dados, vale a coleta que acabou de rodar ("theirs" é o commit local durante o rebase).
          # O GitHub às vezes recusa o envio com erro interno; tenta de novo antes de perder a coleta.
          for tentativa in 1 2 3 4; do
            git pull --rebase -X theirs && git push && exit 0
            echo "Envio falhou (tentativa $tentativa); nova tentativa em $((tentativa * 20)) s."
            sleep $((tentativa * 20))
          done
          exit 1

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: publicacao
        uses: actions/deploy-pages@v4
