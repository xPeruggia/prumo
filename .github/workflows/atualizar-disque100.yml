# Microdados do Disque 100: arquivos de 1 a 2 GB publicados a cada trimestre ou semestre.
# Toda segunda-feira (8h de Brasília) o fluxo confere se algum arquivo é novo ou mudou (pela etiqueta do servidor)
# e só então baixa e processa. Os totais mensais ficam em data/cache/disque100/ e a coleta diária
# é disparada em seguida para montar e publicar o site com eles.

name: Atualizar Disque 100

on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: atualizar-disque100
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Processar arquivos novos ou alterados
        run: node scripts/seguranca.mjs disque100

      - name: Registrar os totais no histórico
        id: registro
        run: |
          git config user.name "prumo-coleta"
          git config user.email "prumo-coleta@users.noreply.github.com"
          git add data/cache/disque100/
          if git diff --cached --quiet; then
            echo "Nenhum arquivo novo do Disque 100."
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Disque 100: totais atualizados em $(TZ=America/Sao_Paulo date +'%d/%m/%Y')"
          git pull --rebase
          git push
          echo "mudou=sim" >> "$GITHUB_OUTPUT"

      - name: Publicar o site com os novos totais
        if: steps.registro.outputs.mudou == 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run atualizar-dados.yml --ref "${{ github.ref_name }}"
